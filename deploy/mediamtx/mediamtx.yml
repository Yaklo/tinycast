# MediaMTX 配置（宿主机 / Windows 部署）
#
# MediaMTX 只负责收发媒体流；谁能推流、房间什么时候结束、多少人观看，
# 全部由 tinycast 后端决定。因此这里最关键的三件事是：
#   1. authMethod: http —— 每个 publish / read 请求都回调后端；
#   2. api 只监听 127.0.0.1 —— 后端要靠它读路径与编码，公网不该看到它；
#   3. hlsDirectory: "" —— HLS 分片放内存，不落盘。

# 默认只记录 error；排查时改成 info 或 debug。
logLevel: error
logDestinations: [stdout]

# 供 tinycast 读取路径状态（/v3/paths/list）。默认端口 9997，只给本机。
# 改这里的端口时必须同步改 tinycast 的 MEDIAMTX_API_URL，否则房间状态不会更新。
api: yes
apiAddress: 127.0.0.1:9997

# OBS 推流入口
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"

# 浏览器播放（经 tinycast 的 /hls/ 反向代理转发，因此只监听本机）
hls: yes
hlsAddress: 127.0.0.1:8888
hlsVariant: lowLatency
hlsPartDuration: 200ms
hlsSegmentDuration: 1s  # 只在关键帧处切；建议 OBS 关键帧间隔设为 1 秒
hlsDirectory: ""
hlsAlwaysRemux: no

# 浏览器播放（经 tinycast 的 /rtc/ 反向代理转发，信令只监听本机）
webrtc: yes
webrtcAddress: 127.0.0.1:8889
# 观众能访问到的地址。本机测试保持 127.0.0.1；
# 局域网/公网部署请改成服务器的实际 IP 或域名，例如 [live.example.com]
webrtcAdditionalHosts: [127.0.0.1]
# WebRTC 媒体走 UDP 8000，防火墙必须放通
webrtcLocalUDPAddress: :8000

srt: no
rtsp: no
# 不启用 MoQ，省掉 8892/8893 两组端口
moq: no

# 所有推流/播放请求先问后端；后端按用户名 + 令牌判断能否推流。
# 端口要与 tinycast 的 INTERNAL_ADDR 一致（未配置时是 HTTP_ADDR）；启动时会自检并报错。
authMethod: http
authHTTPAddress: http://127.0.0.1:18856/internal/mtx/auth

# 任何路径都走 all_others，不预创建房间
paths:
  all_others:
