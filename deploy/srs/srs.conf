# TinyCast 使用的 SRS 6 配置
# 职责划分：SRS 只负责 RTMP 接入与 WebRTC 分发，业务鉴权/房间/人数全部在 Go 后端。
#
# 部署到宿主机时把 http_hooks 里的 tinycast 换成 127.0.0.1；
# 用 docker compose 部署时保持 tinycast（compose 服务名）即可。
# 若给 Go 后端配置了 SRS_CALLBACK_SECRET=xxx，四个回调地址都要补上 "?secret=xxx"。

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

# SRS HTTP API：播放用的 WHEP 信令（/rtc/v1/whep/）与客户端列表（/api/v1/clients/）
http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

# SRS HTTP 静态服务（本项目不使用 HLS/HTTP-FLV，保留默认端口便于排查）
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

stats {
    network         0;
}

# WebRTC 媒体服务：UDP 8000 必须对公网可达（或通过 TURN 解决）
rtc_server {
    enabled         on;
    listen          8000;
    # Docker 部署时用环境变量 CANDIDATE 指定公网 IP/域名，见 docker-compose.yml
    candidate       §CANDIDATE;
    # 自动探测网卡地址作为候选，candidate 为 * 时生效
    use_auto_detect_network_ip on;
    ip_family       ipv4;
}

vhost __defaultVhost__ {
    # OBS 用 RTMP 推流，浏览器用 WebRTC 播放，因此必须打开 rtmp_to_rtc（AAC 会转码为 Opus）
    rtc {
        enabled     on;
        rtmp_to_rtc on;
        rtc_to_rtmp off;
        nack        on;
        twcc        on;
    }

    # 播放端从关键帧开始，减少首屏等待
    play {
        gop_cache       on;
        queue_length    10;
    }

    # 业务回调：Go 后端返回 200 且响应体为整数 0 时放行，否则拒绝推流/播放
    http_hooks {
        enabled         on;
        on_publish      http://tinycast:8080/internal/srs/on_publish;
        on_unpublish    http://tinycast:8080/internal/srs/on_unpublish;
        on_play         http://tinycast:8080/internal/srs/on_play;
        on_stop         http://tinycast:8080/internal/srs/on_stop;
    }
}
