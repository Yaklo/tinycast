# TinyCast 的 Windows 本地联调配置（SRS 6.0.172，官方 Cygwin 构建）。
# 在 srs 目录内执行：objs\srs.exe -c conf\srs.conf
# 生产环境请改用 deploy/srs/srs.conf，并按需开启 HTTPS 与 WebRTC 公网 candidate。

listen              1935;
max_connections     512;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

# tinycast 已占用 8080，且页面直接用 WebRTC(WHEP) 播放，不需要 SRS 的 http 静态服务。
http_server {
    enabled         off;
}

stats {
    network         0;
}

rtc_server {
    enabled         on;
    listen          8000;    # UDP
    # candidate * 表示由 SRS 自动探测本机网卡地址：本机浏览器与局域网内
    # 其它设备（手机、另一台电脑）都能直接连上，不需要手改配置。
    # 如果服务器在 NAT 后面（云主机、家用路由器），这里要改成公网 IP 或域名，
    # 并确保 UDP 8000 在安全组/防火墙上放行（Windows 可运行 open-firewall.cmd）。
    candidate       *;
    use_auto_detect_network_ip on;
}

vhost __defaultVhost__ {
    rtc {
        enabled     on;
        rtmp_to_rtc on;      # OBS 推 RTMP，浏览器用 WebRTC 播放
        rtc_to_rtmp off;
    }
    play {
        gop_cache   on;
        queue_length 10;
    }
    http_hooks {
        enabled         on;
        on_publish      http://127.0.0.1:8080/internal/srs/on_publish;
        on_unpublish    http://127.0.0.1:8080/internal/srs/on_unpublish;
        on_play         http://127.0.0.1:8080/internal/srs/on_play;
        on_stop         http://127.0.0.1:8080/internal/srs/on_stop;
    }
}
