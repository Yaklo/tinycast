# TinyCast 单机部署：SRS 负责媒体，tinycast 负责业务与页面
# 首次启动：cp .env.example .env && 按需修改 SRS_CANDIDATE / PUBLIC_* 后 docker compose up -d --build
services:
  srs:
    image: ossrs/srs:6
    container_name: tinycast-srs
    restart: unless-stopped
    command: ["./objs/srs", "-c", "conf/srs.conf"]
    environment:
      # 公网可达的 IP 或域名，浏览器据此连接 WebRTC（UDP 8000）
      CANDIDATE: ${SRS_CANDIDATE:-127.0.0.1}
    volumes:
      - ./deploy/srs/srs.conf:/usr/local/srs/conf/srs.conf:ro
    ports:
      - "1935:1935"      # RTMP 推流（OBS）
      - "1985:1985"      # SRS HTTP API / WHEP 信令（仅本机部署时可关闭对外暴露）
      - "8000:8000/udp"  # WebRTC 媒体
      - "8000:8000/tcp"  # WebRTC over TCP 兜底
    networks:
      - tinycast

  tinycast:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tinycast-app
    restart: unless-stopped
    depends_on:
      - srs
    environment:
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ROOM_GRACE: ${ROOM_GRACE:-5m}
      JANITOR_INTERVAL: ${JANITOR_INTERVAL:-15s}
      SRS_APP: live
      # 回调来源只允许 compose 内网与回环地址
      SRS_CALLBACK_ALLOWED_CIDRS: "172.16.0.0/12,127.0.0.0/8"
      SRS_CALLBACK_SECRET: ${SRS_CALLBACK_SECRET:-}
      # 展示给用户的推流地址（OBS）
      SRS_RTMP_PUBLIC_BASE: ${SRS_RTMP_PUBLIC_BASE:-rtmp://localhost/live}
      SRS_WEBRTC_PUBLIC_BASE: ${SRS_WEBRTC_PUBLIC_BASE:-webrtc://localhost/live}
      # 浏览器同源访问 /rtc/* 时由 Go 反代到 SRS，避免 SRS CORS 配置
      SRS_RTC_PROXY_TARGET: http://srs:1985
      SRS_CLIENTS_API_URL: http://srs:1985/api/v1/clients/
    ports:
      - "8080:8080"
    networks:
      - tinycast

networks:
  tinycast:
    driver: bridge
