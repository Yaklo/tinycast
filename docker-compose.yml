# 一台机器跑完整套服务：MediaMTX 负责媒体，tinycast 负责业务
#
#   docker compose up -d --build
#   # 浏览器打开 http://<服务器地址>:18855
#
# 正式部署请把 MEDIAMTX_RTMP_PUBLIC_BASE 改成观众能访问的地址，
# 并同步修改 deploy/mediamtx/mediamtx.docker.yml 里的 webrtcAdditionalHosts。

services:
  tinycast:
    build:
      context: .
      # 镜像里没有 .git，版本号由这里注入；打包前可 export TINYCAST_VERSION=v0.1.0
      args:
        VERSION: ${TINYCAST_VERSION:-devel}
        COMMIT: ${TINYCAST_COMMIT:-}
        BUILD_TIME: ${TINYCAST_BUILD_TIME:-}
    image: tinycast:latest
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":18855"
      INTERNAL_ADDR: "0.0.0.0:18856"
      LOG_FILE: /var/log/tinycast/tinycast.log
      LOG_LEVEL: ${LOG_LEVEL:-error}
      LOG_CONSOLE_LEVEL: ${LOG_CONSOLE_LEVEL:-}
      LOG_MAX_MB: ${LOG_MAX_MB:-16}
      LOG_KEEP: ${LOG_KEEP:-3}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.0/8,::1/128}
      ROOM_GRACE: ${ROOM_GRACE:-5m}
      MONITOR_INTERVAL: ${MONITOR_INTERVAL:-1s}
      VIEWER_TIMEOUT: ${VIEWER_TIMEOUT:-30s}
      PENDING_TIMEOUT: ${PENDING_TIMEOUT:-60s}
      MEDIAMTX_APP: live
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_HLS_PROXY_TARGET: http://mediamtx:8888
      MEDIAMTX_WHEP_PROXY_TARGET: http://mediamtx:8889
      MEDIAMTX_RTMP_PUBLIC_BASE: ${MEDIAMTX_RTMP_PUBLIC_BASE:-rtmp://localhost:1935/live}
      MEDIAMTX_AUTH_ALLOWED_CIDRS: ${MEDIAMTX_AUTH_ALLOWED_CIDRS:-127.0.0.0/8,::1/128,172.16.0.0/12}
      MEDIAMTX_AUTH_SECRET: ${MEDIAMTX_AUTH_SECRET:-}
      MEDIAMTX_API_USER: ${MEDIAMTX_API_USER:-}
      MEDIAMTX_API_PASSWORD: ${MEDIAMTX_API_PASSWORD:-}
    volumes:
      - tinycast-logs:/var/log/tinycast
    ports:
      - "18855:18855"

  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    restart: unless-stopped
    environment:
      # 与 tinycast 用同一份回调密钥；为空时只依赖容器网络内的来源白名单
      MTX_AUTHHTTPADDRESS: "http://tinycast:18856/internal/mtx/auth?secret=${MEDIAMTX_AUTH_SECRET:-}"
    volumes:
      - ./deploy/mediamtx/mediamtx.docker.yml:/mediamtx.yml:ro
    ports:
      - "1935:1935"    # OBS 推流
      - "8000:8000/udp" # WebRTC 媒体

volumes:
  tinycast-logs:
